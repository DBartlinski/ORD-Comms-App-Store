<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ORD Comms App Store</title>
    <script>
      // SPA redirect for GitHub Pages — converts 404 paths to query params
      // so the SPA router can handle them client-side
      var pathSegmentsToKeep = 1; // keep /ORD-Comms-App-Store/ prefix
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
